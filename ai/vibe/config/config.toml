theme = "catppuccin-mocha"
applied_migrations = [
    "bash_read_only_defaults_v1",
]

[tools.bash]
allowlist = [
    "basename",
    "cat",
    "cd",
    "comm",
    "cp",
    "cut",
    "date",
    "diff",
    "dirname",
    "dscl",
    "du",
    "echo",
    "env",
    "file",
    "find",
    "fmt",
    "fold",
    "git -C /Users/iheitlager/.dotfiles ls-files",
    "git config --global user.email <redirect>",
    "git config --global user.name <redirect>",
    "git diff",
    "git log",
    "git status",
    "grep",
    "head",
    "join",
    "less",
    "ls",
    "md5sum",
    "mkdir",
    "more",
    "nl",
    "od",
    "paste",
    "pwd",
    "readlink",
    "sed",
    "sha1sum",
    "sha256sum",
    "shasum",
    "sort",
    "stat",
    "sum",
    "tac",
    "tail",
    "tr",
    "tree",
    "true",
    "uname",
    "uniq",
    "vibe",
    "vibe-path:exact:/Users/iheitlager",
    "vibe-path:exact:/Users/iheitlager/.cache",
    "vibe-path:exact:/Users/iheitlager/.config",
    "vibe-path:exact:/Users/iheitlager/.local/share",
    "vibe-path:exact:/Users/iheitlager/.local/share/Brewfile",
    "vibe-path:exact:/Users/iheitlager/.local/state",
    "vibe-path:exact:/Users/iheitlager/.opencode",
    "vibe-path:exact:/Users/iheitlager/.vibe",
    "vibe-path:exact:/Users/iheitlager/.vibe/config.json",
    "vibe-path:exact:/Users/iheitlager/.vibe/config.toml",
    "vibe-path:exact:/Users/iheitlager/.vibe/whoami_cache.json",
    "vibe-path:exact:/Users/iheitlager/opencode",
    "wc",
    "which",
    "whoami",
]
